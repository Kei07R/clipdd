<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ghost-border {
            outline: 1px solid rgba(204, 195, 216, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-[#F7F9FB] dark:bg-[#191C1E] flex justify-center items-center w-full h-16 px-4 fixed top-0 z-50">
<div class="flex items-center justify-between w-full max-w-7xl">
<div class="w-10">
<span class="material-symbols-outlined text-[#7C3AED] cursor-pointer hover:opacity-80 transition-opacity">menu</span>
</div>
<h1 class="font-['Manrope'] font-extrabold uppercase tracking-widest text-lg text-[#7C3AED]">CLIPDD</h1>
<div class="w-10 flex justify-end">
<span class="material-symbols-outlined text-[#7C3AED] cursor-pointer hover:opacity-80 transition-opacity">account_circle</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-6 flex flex-col items-center max-w-lg mx-auto w-full">
<!-- Hero Section -->
<div class="text-center mb-10">
<h2 class="text-4xl font-extrabold tracking-tight mb-3">Your photo. Every art style.</h2>
<p class="text-on-surface-variant font-light text-lg">Transform ordinary moments into curated masterpieces.</p>
</div>
<!-- Upload Area (Bento-style focus) -->
<div class="w-full aspect-square bg-surface-container-lowest rounded-DEFAULT border-2 border-dashed border-primary-container flex flex-col items-center justify-center p-8 mb-8 group cursor-pointer hover:bg-surface-container-low transition-colors duration-300">
<div class="w-20 h-20 bg-primary-fixed rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-primary text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add_photo_alternate</span>
</div>
<p class="font-medium text-primary text-center">Tap to upload or drag &amp; drop</p>
<p class="text-xs text-on-surface-variant mt-1">High resolution JPG or PNG supported</p>
</div>
<!-- Action Buttons -->
<div class="w-full grid grid-cols-2 gap-4 mb-10">
<button class="bg-primary-container text-white py-4 px-6 rounded-DEFAULT font-bold flex items-center justify-center gap-2 hover:bg-primary transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-xl">photo_camera</span>
                CAMERA
            </button>
<button class="bg-primary-container text-white py-4 px-6 rounded-DEFAULT font-bold flex items-center justify-center gap-2 hover:bg-primary transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-xl">grid_view</span>
                GALLERY
            </button>
</div>
<!-- Filter Selection Section -->
<div class="w-full flex flex-col items-center">
<span class="font-label text-[10px] font-medium uppercase tracking-[0.05rem] text-on-surface-variant mb-4">Current Selection</span>
<button class="w-full bg-surface-container-lowest ghost-border py-4 px-8 rounded-DEFAULT flex items-center justify-between group hover:bg-primary-fixed transition-all active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-fixed overflow-hidden flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">palette</span>
</div>
<span class="font-bold text-on-surface">CHOOSE FILTER</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
<!-- Visual Soul: Texture/Image -->
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-2 bg-white dark:bg-[#191C1E] z-50 rounded-t-[10px] shadow-[0px_-4px_20px_0px_rgba(25,28,30,0.04)]">
<!-- Home Tab -->
<a class="flex flex-col items-center justify-center bg-[#EADDFF] text-[#5A00C6] rounded-[10px] px-6 py-2 transition-transform duration-200 scale-95" href="#">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-['Manrope'] font-medium text-[10px] uppercase tracking-[0.05rem] mt-1">Home</span>
</a>
<!-- Styles Tab -->
<a class="flex flex-col items-center justify-center text-[#191C1E] opacity-50 hover:bg-[#F7F9FB] dark:hover:bg-slate-800 transition-opacity" href="#">
<span class="material-symbols-outlined">palette</span>
<span class="font-['Manrope'] font-medium text-[10px] uppercase tracking-[0.05rem] mt-1">Styles</span>
</a>
<!-- Gallery Tab -->
<a class="flex flex-col items-center justify-center text-[#191C1E] opacity-50 hover:bg-[#F7F9FB] dark:hover:bg-slate-800 transition-opacity" href="#">
<span class="material-symbols-outlined">grid_view</span>
<span class="font-['Manrope'] font-medium text-[10px] uppercase tracking-[0.05rem] mt-1">Gallery</span>
</a>
</nav>
