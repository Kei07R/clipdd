<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clipdd — API Test Client</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 32px 24px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #777;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    /* ── Config bar ── */
    .config {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .config label { font-size: 0.85rem; color: #888; white-space: nowrap; }

    .config input {
      flex: 1;
      max-width: 340px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 12px;
      color: #f0f0f0;
      font-size: 0.85rem;
    }

    /* ── Upload zone ── */
    #drop-zone {
      border: 2px dashed #333;
      border-radius: 16px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-bottom: 20px;
      position: relative;
    }

    #drop-zone.drag-over {
      border-color: #6c63ff;
      background: rgba(108, 99, 255, 0.06);
    }

    #drop-zone.has-image {
      padding: 16px;
      border-color: #444;
    }

    #drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop-hint { color: #555; font-size: 0.9rem; pointer-events: none; }
    .drop-hint span { display: block; font-size: 2rem; margin-bottom: 8px; }

    #preview {
      max-width: 100%;
      max-height: 300px;
      border-radius: 12px;
      display: none;
      margin: 0 auto;
      object-fit: contain;
    }

    /* ── Generate button ── */
    #generate-btn {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 36px;
      padding: 14px;
      background: #6c63ff;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    #generate-btn:hover:not(:disabled) { background: #7c74ff; }
    #generate-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Status ── */
    #status {
      text-align: center;
      font-size: 0.88rem;
      color: #888;
      margin-bottom: 28px;
      min-height: 20px;
    }

    #status.error { color: #ff5f5f; }

    /* ── Results grid ── */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 12px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-body {
      position: relative;
      aspect-ratio: 1;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-body img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body .placeholder {
      color: #444;
      font-size: 0.85rem;
    }

    .card-body .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #333;
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .card-body .card-error {
      color: #ff5f5f;
      font-size: 0.8rem;
      text-align: center;
      padding: 16px;
    }

    .card-footer {
      padding: 10px 16px;
      display: flex;
      justify-content: flex-end;
    }

    .card-footer a {
      font-size: 0.8rem;
      color: #6c63ff;
      text-decoration: none;
    }

    .card-footer a:hover { text-decoration: underline; }

    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 99px;
      background: #2a2a2a;
      color: #aaa;
      margin-left: auto;
    }

    .badge.success { background: #1a3a2a; color: #4caf7d; }
    .badge.error   { background: #3a1a1a; color: #ff5f5f; }
    .badge.loading { background: #1e1a3a; color: #8c84ff; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Style picker ── */
    .style-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .style-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border: 1px solid #333;
      border-radius: 99px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #aaa;
      background: #1a1a1a;
      user-select: none;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
    }

    .style-toggle input { display: none; }

    .style-toggle.checked {
      border-color: #6c63ff;
      background: rgba(108, 99, 255, 0.12);
      color: #f0f0f0;
    }

    .picker-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .picker-actions button {
      background: none;
      border: none;
      color: #666;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0;
    }

    .picker-actions button:hover { color: #aaa; }

    /* ── Timing ── */
    #timing {
      text-align: center;
      font-size: 0.8rem;
      color: #555;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <h1>Clipdd</h1>
  <p class="subtitle">API test client — select styles, upload a photo, and preview outputs</p>

  <div class="config">
    <label for="api-url">Backend URL</label>
    <input id="api-url" type="text" value="http://localhost:3000" />
  </div>

  <div id="drop-zone">
    <input type="file" id="file-input" accept="image/*" />
    <div class="drop-hint">
      <span>🖼️</span>
      Click or drag an image here
    </div>
    <img id="preview" alt="Preview" />
  </div>

  <div class="style-picker" id="style-picker"></div>
  <div class="picker-actions">
    <button id="select-all">Select all</button>
    <button id="select-none">Clear</button>
  </div>

  <button id="generate-btn" disabled>Generate</button>

  <div id="status"></div>

  <div class="results-grid" id="results-grid"></div>

  <div id="timing"></div>

  <script>
    const STYLES = [
      { key: 'anime',    label: 'Anime',     emoji: '🎌' },
      { key: 'ghibli',   label: 'Ghibli',    emoji: '🌿' },
      { key: 'pixelart', label: 'Pixel Art', emoji: '🕹️' },
      { key: 'comic',    label: 'Comic',     emoji: '💥' },
      { key: 'cartoon',  label: 'Cartoon',   emoji: '🎨' },
    ];

    const dropZone    = document.getElementById('drop-zone');
    const fileInput   = document.getElementById('file-input');
    const preview     = document.getElementById('preview');
    const btn         = document.getElementById('generate-btn');
    const statusEl    = document.getElementById('status');
    const gridEl      = document.getElementById('results-grid');
    const timingEl    = document.getElementById('timing');
    const apiUrlEl    = document.getElementById('api-url');
    const pickerEl    = document.getElementById('style-picker');

    let selectedFile = null;

    // ── Style picker ─────────────────────────────────────────────
    for (const style of STYLES) {
      const label = document.createElement('label');
      label.className = 'style-toggle checked';
      label.innerHTML = `<input type="checkbox" value="${style.key}" checked />${style.emoji} ${style.label}`;
      label.querySelector('input').addEventListener('change', () => {
        label.classList.toggle('checked', label.querySelector('input').checked);
        updateBtn();
      });
      pickerEl.appendChild(label);
    }

    document.getElementById('select-all').addEventListener('click', () => {
      pickerEl.querySelectorAll('input').forEach((cb) => { cb.checked = true; cb.closest('label').classList.add('checked'); });
      updateBtn();
    });

    document.getElementById('select-none').addEventListener('click', () => {
      pickerEl.querySelectorAll('input').forEach((cb) => { cb.checked = false; cb.closest('label').classList.remove('checked'); });
      updateBtn();
    });

    function selectedStyles() {
      return [...pickerEl.querySelectorAll('input:checked')].map((cb) => cb.value);
    }

    function updateBtn() {
      btn.disabled = !selectedFile || selectedStyles().length === 0;
      const n = selectedStyles().length;
      btn.textContent = n === 0 ? 'Select at least one style' : `Generate ${n} Style${n > 1 ? 's' : ''}`;
    }

    // ── File selection ──────────────────────────────────────────
    fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      selectedFile = file;

      const reader = new FileReader();
      reader.onload = (e) => {
        preview.src = e.target.result;
        preview.style.display = 'block';
        dropZone.querySelector('.drop-hint').style.display = 'none';
        dropZone.classList.add('has-image');
      };
      reader.readAsDataURL(file);

      updateBtn();
      clearResults();
    }

    // ── Generate ────────────────────────────────────────────────
    btn.addEventListener('click', generate);

    async function generate() {
      if (!selectedFile) return;

      const styles = selectedStyles();
      if (styles.length === 0) return;

      const baseUrl = apiUrlEl.value.replace(/\/$/, '');

      btn.disabled = true;
      setStatus(`Generating ${styles.length} style${styles.length > 1 ? 's' : ''} sequentially…`);
      timingEl.textContent = '';

      buildLoadingCards(styles);

      const formData = new FormData();
      formData.append('image', selectedFile);
      formData.append('styles', styles.join(','));

      const start = Date.now();

      try {
        const res = await fetch(`${baseUrl}/api/generate`, {
          method: 'POST',
          body: formData,
        });

        const elapsed = ((Date.now() - start) / 1000).toFixed(1);

        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || `HTTP ${res.status}`);
        }

        const { results } = await res.json();
        renderResults(results);

        const successCount = results.filter((r) => !r.error).length;
        setStatus(`Done — ${successCount}/${styles.length} styles generated in ${elapsed}s`);
        timingEl.textContent = `Total round-trip: ${elapsed}s`;
      } catch (err) {
        setStatus(err.message, true);
        clearCards();
      } finally {
        updateBtn();
      }
    }

    // ── UI helpers ──────────────────────────────────────────────
    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = isError ? 'error' : '';
    }

    function clearResults() {
      gridEl.innerHTML = '';
      statusEl.textContent = '';
      timingEl.textContent = '';
    }

    function clearCards() {
      gridEl.innerHTML = '';
    }

    function buildLoadingCards(styleKeys) {
      gridEl.innerHTML = '';
      const active = STYLES.filter((s) => styleKeys.includes(s.key));
      for (const style of active) {
        gridEl.insertAdjacentHTML('beforeend', `
          <div class="card" id="card-${style.key}">
            <div class="card-header">
              ${style.emoji} ${style.label}
              <span class="badge loading">generating…</span>
            </div>
            <div class="card-body">
              <div class="spinner"></div>
            </div>
            <div class="card-footer"></div>
          </div>
        `);
      }
    }

    function renderResults(results) {
      for (const result of results) {
        const card = document.getElementById(`card-${result.style}`);
        if (!card) continue;

        const badge  = card.querySelector('.badge');
        const body   = card.querySelector('.card-body');
        const footer = card.querySelector('.card-footer');

        if (result.error) {
          badge.className = 'badge error';
          badge.textContent = 'failed';
          body.innerHTML = `<div class="card-error">${result.error}</div>`;
        } else {
          badge.className = 'badge success';
          badge.textContent = 'done';
          body.innerHTML = `<img src="${result.imageUrl}" alt="${result.label}" loading="lazy" />`;
          footer.innerHTML = `<a href="${result.imageUrl}" target="_blank" rel="noopener">Open full size ↗</a>`;
        }
      }
    }
  </script>
</body>
</html>
